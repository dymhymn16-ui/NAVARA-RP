name: NAVARA-RP Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check NAVARA-RP source
        run: |
          echo "Checking gamemode..."
          test -f gamemodes/new.pwn
          echo "gamemodes/new.pwn موجود بنجاح ✅"
